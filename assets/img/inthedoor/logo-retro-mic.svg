<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="In The Door Co. secondary mark: a vintage broadcast microphone inside a ring">
  <rect width="200" height="200" fill="#ffffff" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#000000" stroke-width="7" />
  <g fill="none" stroke="#000000" stroke-width="6">
    <!-- mic head: rounded rectangle, not a pill -->
    <rect x="63" y="32" width="74" height="92" rx="24" />
    <!-- grille lines -->
    <line x1="66" y1="52" x2="134" y2="52" />
    <line x1="64" y1="66" x2="136" y2="66" />
    <line x1="64" y1="80" x2="136" y2="80" />
    <line x1="64" y1="94" x2="136" y2="94" />
    <line x1="66" y1="108" x2="134" y2="108" />
  </g>
  <!-- neck -->
  <rect x="92" y="124" width="16" height="16" fill="#000000" />
  <!-- stand -->
  <path d="M68 172l16-32h32l16 32Z" fill="none" stroke="#000000" stroke-width="7" stroke-linejoin="round" />
</svg>
